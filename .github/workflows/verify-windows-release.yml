name: Verify published Windows EXEs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published Windows release tag
        default: v1.2.4
        required: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2022, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download and start both public EXEs
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -cnotmatch '^v\d+\.\d+\.\d+(-(?:alpha|beta|rc)\.\d+)?$') { throw 'Invalid release tag' }
          $version = $env:RELEASE_TAG.Substring(1)
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG"
          $manifest = (Invoke-WebRequest "$base/SHA256SUMS.txt").Content
          if ($manifest -is [byte[]]) { $manifest = [Text.Encoding]::UTF8.GetString($manifest) }
          foreach ($type in 'Portable','Setup') {
            $baseVersion = ($version -split '-')[0]
            $name = if ([version]$baseVersion -ge [version]'2.0.0') { "UltraFile-$version-Windows-x64-$type.exe" } else { "WXFileHelper-$version-Windows-x64-$type.exe" }
            if ($env:RELEASE_TAG -eq 'v2.0.0-beta.1') { $name = "UltraFile-$baseVersion-Windows-x64-$type.exe" }
            $file = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest "$base/$name" -OutFile $file
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if (($manifest -split '\r?\n') -cnotcontains "$digest  $name") { throw "Checksum mismatch for $name" }
            if ($version -match '^0\.') {
              ./scripts/smoke_windows.ps1 -Executable $file
            } elseif ($type -eq 'Setup' -and [version]($version -split '-')[0] -ge [version]'1.2.2') {
              $checkLocalSend = $env:RELEASE_TAG -eq 'v2.0.0-beta.3'
              if ($checkLocalSend) {
                $zip = 'LocalSend-1.19.0-windows-x86-64.zip'
                Invoke-WebRequest "$base/$zip" -OutFile (Join-Path $env:RUNNER_TEMP $zip)
              }
              ./native/packaging/windows/smoke.ps1 -Executable $file -VerifyShortcuts -VerifyLocalSend:$checkLocalSend
            } else {
              ./native/packaging/windows/smoke.ps1 -Executable $file
            }
          }
