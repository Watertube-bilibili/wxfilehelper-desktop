<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#f2f5ef"><link rel="icon" href="./logo.png"><link rel="stylesheet" href="./site.css"><title>超级文件直传 · Ultra File</title></head>
<body><header><a class="brand" href="./"><img src="./logo.png" width="40" height="40" alt=""><span>超级文件<small>Ultra File</small></span></a><button id="lang" class="text-button" type="button">English</button></header>
<main><div class="intro"><h1 data-en="File transfer">文件直传</h1><p data-en="Send a file to another device using its pairing code.">用配对码，在两台设备之间直接传文件。</p></div>
<section class="work"><div class="tabs" role="tablist" aria-label="Transfer"><button role="tab" aria-selected="true" aria-controls="receive" id="tabReceive" data-en="Receive">接收</button><button role="tab" aria-selected="false" aria-controls="send" id="tabSend" data-en="Send">发送</button></div>
<div id="receive" role="tabpanel" aria-labelledby="tabReceive"><h2 data-en="Receive on this device">在此设备接收</h2><p data-en="Create a code and share it with the sender. Keep this page open.">生成配对码发给对方，接收时保持此页打开。</p><div class="code" id="code" aria-live="polite">—</div><div class="actions"><button class="primary" id="listen" data-en="Create pairing code">生成接收码</button><button id="copyCode" data-en="Copy code" hidden>复制配对码</button><button id="copyLink" data-en="Copy invitation link" hidden>复制邀请链接</button></div></div>
<div id="send" role="tabpanel" aria-labelledby="tabSend" hidden><h2 data-en="Send to another device">发送到其他设备</h2><label for="peer" data-en="Receiver’s code">对方的接收码</label><input id="peer" autocapitalize="off" autocomplete="off" spellcheck="false" maxlength="17" placeholder="abcd efgh jkmn"><label for="file" class="pick"><strong id="fileName" data-en="Choose a file">选择文件</strong><span id="fileSize" data-en="Or drop one file here">也可以把一个文件拖到这里</span></label><input id="file" class="sr" type="file"><button class="primary" id="offer" data-en="Send file">发送文件</button></div>
<div class="feedback" id="feedback" hidden><div id="status" role="status" aria-live="polite"></div><div id="incoming"></div><progress id="progress" max="1" value="0" hidden></progress><div id="meter"></div><div class="actions"><button class="primary" id="accept" data-en="Accept file" hidden>接收文件</button><button id="reject" data-en="Decline" hidden>拒绝</button><button id="cancel" data-en="Cancel transfer" hidden>取消</button><a id="save" class="button" hidden data-en="Save received file">保存收到的文件</a></div></div></section>
<footer><span data-en="Encrypted UDP · SHA-256 verification">UDP 加密直传 · SHA-256 完整性校验</span><a href="https://github.com/Watertube-bilibili/wxfilehelper-desktop" data-en="Source code">开源代码</a></footer></main>
<script src="./sha256.min.js" defer></script><script src="./transfer.js" defer></script></body></html>
